# Limites de riesgo - EXTRAIDOS de encuesta + 7 aclaraciones (2026-08).
# Ver docs/ESTRATEGIA_EXTRAIDA.md > "Clarificaciones" para el razonamiento.

# --- Sizing ---
# CONFIRMADO por ella: usa la formula de LOTES (no la de 1% riesgo).
#   ORO: 0.01 lote = $1/pip (pip = ultimos 3 digitos) -> 0.01/$1000 de capital.
#   EURUSD/GBPUSD: 0.01 lote = $0.10/pip.
# El motor dimensiona por ESTA regla y REPORTA el % de riesgo efectivo (suele
# quedar ~2% a 20-40 pips de SL, no 1%). El 1% era la meta aspiracional.
lots_per_1000_capital: 0.01
max_risk_per_trade_pct_softcap: 2.5   # alerta si el sizing efectivo lo supera

# --- Limites operativos ---
max_open_positions: 2
max_positions_per_symbol: 1      # si falla/cierra en un par -> ir a OTRO par
max_operations_per_day: 5
max_daily_loss_pct: 5.0          # 5% del capital del dia -> parar el dia
max_drawdown_monthly_pct: 30.0   # 30% mensual -> STOP total (reactivacion manual)
max_consecutive_losses: 5        # 5 PERDIDAS SEGUIDAS -> BLOQUEO total del sistema
reentry_same_zone: false         # si falla la primera, no reentrar esa zona

# --- Kill-switch ---
kill_switch_dd_pct: 30.0
halt_reactivation: manual        # SOLO ella lo reactiva

# --- Sesiones (UTC) ---
sessions:
  london:  [8, 17]
  newyork: [13, 22]
no_trade_weekday: 4              # viernes NO opera
no_hold_over_weekend: true       # cerrar antes del fin de semana
news_filter: high_impact_usd     # no entrar en dias de noticias fuertes del dolar

# --- Salida ---
breakeven_partial:
  trigger_pct_to_tp: 40.0        # a 40% del camino al TP: SL->breakeven + parcial
  close_fraction: 33.3           # cerrar 1/3 del lotaje (ej 0.03 -> 0.02)
rr_target: [2.0, 3.0]            # TP = 2x o 3x la distancia al SL (1:2 o 1:3)

# --- Costos (placeholder H1; afinar por par en Fase 2) ---
costs:
  spread_points:
    EURUSD: 12.0
    GBPUSD: 18.0
    XAUUSD: 35.0
  commission_per_lot: 7.0
  slippage_points: 3.0
  swap_per_lot_per_day: -2.0

# --- NOTA: la definicion EXACTA de estructura SMC (swing pivots, BOS,
#     liquidez) esta PENDIENTE en docs/SMC_DEFINICION_PENDIENTE.md.
#     No se hardcodea aqui hasta quebrada la ambiguedad.
