# Risk Configuration - Completo para validación Pydantic
# Ver backtester/config_loader.py para modelos exactos

# --- Sizing ---
lot_sizing:
  mode: "fixed_lot"          # "pct_risk" | "fixed_lot"
  risk_pct_per_trade: 0.01
  lots_per_1000_capital: 0.01

# --- Risk:Reward ---
risk_reward:
  ratio: 2.0
  fixed: true
  sl_pips:
    XAUUSD: 45.0
    EURUSD: 20.0
    GBPUSD: 22.0

# --- Breakeven ---
breakeven:
  enabled: true
  trigger_pct_of_tp: 40.0
  move_sl_to_entry: true

# --- Partials ---
partials:
  enabled: true
  stages:
    - at_pct_of_tp: 40.0
      close_fraction: 0.333

# --- Limits ---
limits:
  max_concurrent_trades: 2
  max_daily_trades: 5
  daily_loss_limit_pct: 5.0
  monthly_loss_limit_pct: 30.0
  max_consecutive_losses: 5
  reactivation: "manual"
  scope: "per_account"

# --- Session Filters ---
session_filters:
  avoid_friday_afternoon: true
  avoid_weekends: true
  avoid_high_impact_usd_news: true

# --- Rejection Validation (filtros de entrada) ---
rejection_validation:
  atr_period: 14
  max_penetration_atr: 1.0
  min_wick_ratio: 0.5
  max_candles_to_reclaim: 2
  require_volume_spike: true
  volume_spike_multiplier: 1.5

# --- Entry Trigger ---
entry_trigger:
  type: "market"
  double_cross_required: true

# --- Position Management ---
position_management:
  trailing_stop: false
  close_on_friday: true
  close_on_connection_loss: false

# --- Kill Switch ---
kill_switch:
  daily_loss_pct: 5.0
  monthly_loss_pct: 30.0
  consecutive_losses: 5
  reactivation: "manual"

# --- Structure ---
structure:
  macro_timeframes: ["D1", "H4"]
  setup_timeframe: "M15"
  entry_timeframe: "M5"
  trend_lookback_days: 30
  min_pivots_for_trend: 2

# --- Confluence ---
confluence:
  min_sessions: 2
  max_sessions: 3
  tolerance_pips:
    XAUUSD: 100
    EURUSD: 10
    GBPUSD: 10
  weight_multiplier: 1.5

# --- News Filter ---
news_filter:
  lookahead_hours: 24
  currencies: ["USD"]
  impacts: ["high"]
  calendar_source: "external"
  avoid_high_impact_usd_news: true

# --- Costs (legacy, maintained for backward compat) ---
costs:
  spread_points:
    EURUSD: 12.0
    GBPUSD: 18.0
    XAUUSD: 35.0
  commission_per_lot: 7.0
  slippage_points: 3.0
  swap_per_lot_per_day: -2.0

# --- Parámetros operativos (legacy, para compatibilidad) ---
max_open_positions: 2
max_positions_per_symbol: 1
max_operations_per_day: 5
max_daily_loss_pct: 5.0
max_drawdown_monthly_pct: 30.0
max_consecutive_losses: 5
reentry_same_zone: false
kill_switch_dd_pct: 30.0
halt_reactivation: manual
sessions:
  london: [8, 17]
  newyork: [13, 22]
no_trade_weekday: 4
no_hold_over_weekend: true
news_filter_legacy: high_impact_usd

breakeven_partial:
  trigger_pct_to_tp: 40.0
  close_fraction: 33.3
rr_target: [2.0, 3.0]